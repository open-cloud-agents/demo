name: "KinD Sandbox CI Matrix"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind-validation:
    name: "KinD Sandbox Test (${{ matrix.k8s-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s-version:
          - "v1.31.0"
          - "v1.30.2"
          - "v1.29.4"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup KinD
        uses: helm/kind-action@v1.10.0
        with:
          node_image: kindest/node:${{ matrix.k8s-version }}
          cluster_name: demo-test-${{ strategy.job-index }}

      - name: Validate Golden Solution Patch
        run: |
          kubectl apply -f scenarios/billing-service-outage/00-namespace.yaml
          kubectl apply --server-side --dry-run=server -f scenarios/billing-service-outage/solution-patch.yaml
          kubectl apply -f scenarios/billing-service-outage/solution-patch.yaml
          kubectl get pods,svc,endpoints -n demo-billing

